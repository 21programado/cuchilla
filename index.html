<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plano Cuchilla Alta</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Leaflet -->
  <link rel="stylesheet" href="leaflet/leaflet.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .oculto {
      display: none;
    }

    /* Botón Lugares */
    #btnLugares {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 8px 12px;
      font-size: 14px;
    }

    /* Vista Lugares */
    #lugaresView {
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
    }

    .lugar {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .lugar h3 {
      margin: 0;
      font-size: 16px;
    }

    .lugar p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<!-- ===== PLANO ===== -->
<div id="planoView">
  <button id="btnLugares">📍 Lugares</button>
  <div id="map"></div>
</div>

<!-- ===== LUGARES ===== -->
<div id="lugaresView" class="oculto">
  <div class="header">
    <button id="volverPlano">← Plano</button>
    <h2>Lugares</h2>
  </div>

  <div id="listaLugares"></div>
</div>

<!-- Leaflet JS -->
<script src="leaflet/leaflet.js"></script>

<script>
  /* ===== MAPA ===== */

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1
  });

  const bounds = [[0,0], [1170,1528]];

  L.imageOverlay('cuchilla-alta.jpg', bounds).addTo(map);
  map.fitBounds(bounds);

  /* ===== VISTAS ===== */

  const planoView = document.getElementById('planoView');
  const lugaresView = document.getElementById('lugaresView');

  document.getElementById('btnLugares').onclick = () => {
    planoView.classList.add('oculto');
    lugaresView.classList.remove('oculto');
  };

  document.getElementById('volverPlano').onclick = () => {
    lugaresView.classList.add('oculto');
    planoView.classList.remove('oculto');
    map.invalidateSize(); // importante al volver
  };

  /* ===== LUGARES (JSON) ===== */

  fetch('lugares.json')
    .then(res => res.json())
    .then(data => {
      const lista = document.getElementById('listaLugares');

      data.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lugar';
        div.innerHTML = `
          <h3>${l.nombre}</h3>
          <p>${l.detalle}</p>
        `;
        lista.appendChild(div);
      });
    });

  /* ===== SERVICE WORKER ===== */

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
